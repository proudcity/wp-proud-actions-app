<div class="slide-left-2 column">
  <search></search>
  <ol class="breadcrumb clean"><li class="active"><i aria-hidden="true" class="fa fa-th"></i> Select question type</li></ol>
  <dl class="angular-311-2col" role="tablist" aria-multiselectable="true">
    <dd role="presentation" ng-repeat="item in terms | termsNoParent:$root.categories" class="col-sm-6 col-md-4" ng-class="{'active' : item.slug == active.slug, 'expanded': $root.displayExpanded('answers')}">
      <div class="h4" role="tab" id="{{'heading-' + item.slug}}"><a role="button" aria-expanded="{{activeSlug == item.slug}}" aria-controls="{{'options-' + item.slug}}" href="" ng-click="open(item)">
        <i aria-hidden="true" ng-if="item.description" class="fa {{item.description}}"></i><span ng-bind-html="item.name"></span>
      </a></div>
      <div id="{{'options-' + item.slug}}" role="tabpanel" aria-labelledby="{{'heading-' + item.slug}}" class="animation-wrap">
        <div class="slidedown" ng-if="active.id == item.id || $root.displayExpanded('answers')">
          <!-- @todo: ng-repeat="child in terms | filter: { parent: [{slug: item.slug}] } |  orderBy: 'weight'" -->
          <ul class="taxonomy-vocabulary-2col" role="tablist">
            <li role="presentation" ng-repeat="child in terms | termsByParent:item.id" >
              <a role="tab" aria-controls="faq-second-level" main-toggle="slide-left" href="" ui-sref="city.faq.child.answers({slug: child.slug, nid: 'list'})" ng-bind-html="child.name"></a>
            </li>
          </ul>
        </div>
      </div>
    </dd>
  </dl>
</div>

<div class="animation-wrap slide-left-2" aria-hidden="true">
  <div class="quickfade" id="faq-second-level" ui-view></div>
</div>
