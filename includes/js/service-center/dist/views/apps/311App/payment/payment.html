<div class="slide-left-2 column">
  <search></search>
  <ol class="breadcrumb clean">
    <li class="active">
      <i aria-hidden="true" class="fa fa-th"></i> Select {{paymentString | lowercase}} type
    </li>
  </ol>
  <dl class="angular-311-2col" role="tablist">
    <dd role="presentation" ng-repeat="item in posts" class="col-sm-6 col-md-4 category-wrapper">
      <div class="h4"><a role="tab" aria-controls="payments-second-level" main-toggle="slide-left" href="" ui-sref="city.payments.type({slug: item.slug})"><i aria-hidden="true" ng-if="item.meta.icon" class="fa {{item.meta.icon}}"></i><span>{{item.title.rendered}}</span></a></div>
    </dd>
  </dl>
</div>

<div class="animation-wrap slide-left-2" aria-hidden="true">
  <div id="payments-second-level" class="quickfade" ui-view></div>
</div>
